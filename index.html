<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0c1b; /* Fallback for outer background */
        }
        
        /* Custom animations */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }

        /* Hide scrollbar for cleaner look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Customize date picker icon for dark theme */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.7;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- App Container with Image's Gradient Background -->
    <div class="w-full max-w-md min-h-screen relative overflow-hidden shadow-2xl text-white bg-gradient-to-br from-[#231E44] via-[#44315F] to-[#795475]">
        
        <!-- MAIN FORM SCREEN -->
        <div id="main-screen" class="h-full w-full overflow-y-auto no-scrollbar pb-24 relative z-0">
            
            <!-- Header (Glassmorphism) -->
            <div class="flex items-center justify-between p-6 bg-white/5 backdrop-blur-md border-b border-white/10 sticky top-0 z-10">
                <button class="p-2 bg-white/10 hover:bg-white/20 rounded-full transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h1 class="text-lg font-medium tracking-wide">Add Transaction</h1>
                <div class="w-10"></div> <!-- Spacer -->
            </div>

            <div class="p-6 space-y-8">
                <!-- Date Selection -->
                <div>
                    <label class="block text-sm font-light text-gray-300 mb-3">Date of Transaction</label>
                    <input type="date" id="date-input" class="w-full bg-white/10 border border-white/10 p-4 rounded-2xl shadow-sm text-white font-medium focus:ring-2 focus:ring-[#F6C96C] outline-none transition-all backdrop-blur-sm" />
                </div>

                <!-- Category Selection -->
                <div>
                    <label class="block text-sm font-light text-gray-300 mb-3">Category</label>
                    <div class="flex flex-wrap gap-3" id="category-container">
                        <button class="px-5 py-2.5 rounded-full text-sm font-medium transition-all shadow-sm border border-dashed border-[#F6C96C] text-[#F6C96C] hover:bg-[#F6C96C]/10 backdrop-blur-sm">
                            + Add Category
                        </button>
                        <!-- Categories injected by JS -->
                    </div>
                </div>

                <!-- Items List -->
                <div>
                    <div class="flex justify-between items-end mb-3">
                        <label class="block text-sm font-light text-gray-300">Items Details</label>
                        <span class="text-xs text-gray-400">S.No / Item / Qty / Amt</span>
                    </div>
                    
                    <div id="items-container" class="space-y-3">
                        <!-- Items injected by JS -->
                    </div>
                    
                    <button id="add-item-btn" class="mt-4 flex items-center gap-2 text-sm font-medium text-[#F6C96C] hover:text-white transition-colors">
                        <div class="bg-[#F6C96C]/20 p-1.5 rounded-full">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </div>
                        Add More Items
                    </button>
                </div>

                <!-- Total Display (Glass Panel) -->
                <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-6 shadow-xl relative overflow-hidden">
                    <!-- Decorative glow -->
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-[#F6C96C] rounded-full blur-[60px] opacity-20"></div>
                    
                    <p class="text-gray-300 text-sm mb-1 font-light relative z-10">Total Amount</p>
                    <h2 class="text-4xl font-semibold mb-2 text-[#F6C96C] tracking-tight relative z-10" id="display-total-num">$0.00</h2>
                    <div class="bg-black/20 border border-white/10 px-3 py-1.5 rounded-lg inline-block text-xs font-medium backdrop-blur-md relative z-10" id="display-total-words">
                        Zero
                    </div>
                </div>

                <!-- Payment Mode -->
                <div>
                    <label class="block text-sm font-light text-gray-300 mb-3">Mode of Payment</label>
                    <div class="grid grid-cols-2 gap-3" id="payment-container">
                        <!-- Payment modes injected by JS -->
                    </div>
                </div>

                <!-- Attach Bills -->
                <div>
                    <label class="block text-sm font-light text-gray-300 mb-3">Attach Bill</label>
                    <div id="upload-zone" class="border-2 border-dashed border-white/20 rounded-2xl bg-white/5 p-6 flex flex-col items-center justify-center cursor-pointer hover:border-[#F6C96C] hover:bg-white/10 transition-all backdrop-blur-sm">
                        <input type="file" id="file-input" class="hidden" />
                        <div class="bg-black/30 p-3 rounded-full text-[#F6C96C] mb-2 border border-white/10">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        </div>
                        <p class="text-sm font-medium text-gray-200" id="file-name-display">
                            Tap to upload receipt
                        </p>
                        <p class="text-xs text-gray-400 mt-1">PDF, JPG, PNG (Max 5MB)</p>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-light text-gray-300 mb-3">Description</label>
                    <textarea id="description-input" rows="3" placeholder="Write a comment..." class="w-full bg-white/10 border border-white/10 p-4 rounded-2xl shadow-sm text-sm text-white placeholder-gray-400 focus:ring-2 focus:ring-[#F6C96C] outline-none transition-all resize-none backdrop-blur-sm"></textarea>
                </div>
            </div>

            <!-- Save Button (Fixed at bottom with gradient mask) -->
            <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-gradient-to-t from-[#231E44] via-[#231E44]/90 to-transparent z-10 pointer-events-none pb-6">
                <button id="save-btn" class="pointer-events-auto w-full bg-gradient-to-r from-[#F6C96C] to-[#e8b54e] text-[#1c1733] py-4 rounded-2xl font-semibold text-lg shadow-[0_4px_20px_rgba(246,201,108,0.3)] hover:shadow-[0_4px_25px_rgba(246,201,108,0.5)] transition-all">
                    Save Details
                </button>
            </div>
        </div>

        <!-- PREVIEW MODAL (Hidden by default) -->
        <div id="preview-modal" class="hidden absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
            <div class="bg-gradient-to-br from-[#3c2d5c] to-[#261f44] border border-white/20 w-full rounded-[2rem] p-6 shadow-2xl animate-fade-in-up relative overflow-hidden">
                <!-- Decorative element -->
                <div class="absolute top-0 right-0 w-40 h-40 bg-[#F6C96C] rounded-full blur-[80px] opacity-10"></div>
                
                <h3 class="text-xl font-medium text-center mb-6 border-b border-white/10 pb-4">Preview Transaction</h3>
                
                <div class="space-y-4 mb-8 relative z-10">
                    <div class="flex justify-between">
                        <span class="text-gray-400 text-sm font-light">Date</span>
                        <span class="font-medium text-white text-sm" id="preview-date"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400 text-sm font-light">Category</span>
                        <span class="font-medium text-white text-sm" id="preview-category"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400 text-sm font-light">Payment Mode</span>
                        <span class="font-medium text-white text-sm" id="preview-payment"></span>
                    </div>
                    
                    <div class="pt-4 border-t border-dashed border-white/20">
                        <span class="text-gray-400 text-sm font-light block mb-2">Items Summary</span>
                        <div id="preview-items" class="space-y-1.5">
                            <!-- Items injected by JS -->
                        </div>
                    </div>

                    <div class="pt-4 border-t border-white/10 flex justify-between items-center">
                        <span class="text-gray-300 font-medium">Total Amount</span>
                        <span class="text-2xl font-semibold text-[#F6C96C]" id="preview-total"></span>
                    </div>
                </div>

                <div class="flex gap-3 relative z-10">
                    <button id="edit-btn" class="flex-1 py-3.5 rounded-xl font-medium text-white bg-white/10 border border-white/20 hover:bg-white/20 transition-colors">
                        Edit
                    </button>
                    <button id="submit-btn" class="flex-1 py-3.5 rounded-xl font-semibold text-[#1c1733] bg-[#F6C96C] shadow-[0_0_15px_rgba(246,201,108,0.3)] hover:opacity-90 transition-opacity">
                        Submit
                    </button>
                </div>
            </div>
        </div>

        <!-- SUCCESS SCREEN (Hidden by default) -->
        <div id="success-screen" class="hidden h-full w-full bg-gradient-to-br from-[#231E44] via-[#44315F] to-[#795475] flex-col items-center justify-center p-6 text-center absolute inset-0 z-40">
            <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl flex flex-col items-center w-full animate-fade-in-up">
                <div class="bg-[#F6C96C]/20 p-4 rounded-full mb-6 border border-[#F6C96C]/30 shadow-[0_0_30px_rgba(246,201,108,0.2)]">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#F6C96C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>
                <h2 class="text-2xl font-medium text-white mb-2 tracking-wide">Transaction Saved!</h2>
                <p class="text-gray-300 font-light mb-8">Your expense has been successfully recorded.</p>
                <button id="add-another-btn" class="w-full bg-white/10 border border-white/20 text-white py-4 rounded-2xl font-medium text-lg hover:bg-white/20 transition-all">
                    Add Another Expense
                </button>
            </div>
        </div>

    </div>

    <script>
        // State Management
        const state = {
            date: new Date().toISOString().split('T')[0],
            category: '',
            items: [{ id: Date.now(), name: '', qty: '', amount: '' }],
            paymentMode: '',
            description: '',
            fileName: '',
            total: 0
        };

        const categoriesData = ["Vegetables", "Grocery", "Clothes", "Travel", "Petrol"];
        const paymentModesData = ["Cash", "G-Pay", "Phone Pe", "Amazon Pay"];

        // DOM Elements
        const dateInput = document.getElementById('date-input');
        const categoryContainer = document.getElementById('category-container');
        const itemsContainer = document.getElementById('items-container');
        const addItemBtn = document.getElementById('add-item-btn');
        const displayTotalNum = document.getElementById('display-total-num');
        const displayTotalWords = document.getElementById('display-total-words');
        const paymentContainer = document.getElementById('payment-container');
        
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const descriptionInput = document.getElementById('description-input');
        
        const saveBtn = document.getElementById('save-btn');
        
        // Modal & Screens
        const mainScreen = document.getElementById('main-screen');
        const previewModal = document.getElementById('preview-modal');
        const successScreen = document.getElementById('success-screen');
        
        const previewDate = document.getElementById('preview-date');
        const previewCategory = document.getElementById('preview-category');
        const previewPayment = document.getElementById('preview-payment');
        const previewItems = document.getElementById('preview-items');
        const previewTotal = document.getElementById('preview-total');
        
        const editBtn = document.getElementById('edit-btn');
        const submitBtn = document.getElementById('submit-btn');
        const addAnotherBtn = document.getElementById('add-another-btn');

        // Helper: Convert Number to Words
        function numberToWords(amount) {
            const units = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
            const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
            const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

            if (!amount || amount === 0) return "Zero";

            function convertInteger(num) {
                if (num < 10) return units[num];
                if (num < 20) return teens[num - 10];
                if (num < 100) return tens[Math.floor(num / 10)] + (num % 10 !== 0 ? " " + units[num % 10] : "");
                if (num < 1000) return units[Math.floor(num / 100)] + " Hundred" + (num % 100 !== 0 ? " " + convertInteger(num % 100) : "");
                if (num < 1000000) return convertInteger(Math.floor(num / 1000)) + " Thousand" + (num % 1000 !== 0 ? " " + convertInteger(num % 1000) : "");
                if (num < 1000000000) return convertInteger(Math.floor(num / 1000000)) + " Million" + (num % 1000000 !== 0 ? " " + convertInteger(num % 1000000) : "");
                return num.toString();
            }

            const intPart = Math.floor(amount);
            return convertInteger(intPart) + " Only";
        }

        // Calculate and Update Total
        function updateTotal() {
            state.total = state.items.reduce((sum, item) => {
                const qty = parseFloat(item.qty) || 0;
                const amt = parseFloat(item.amount) || 0;
                return sum + (qty * amt);
            }, 0);

            displayTotalNum.innerText = `$${state.total.toFixed(2)}`;
            displayTotalWords.innerText = numberToWords(state.total);
        }

        // Render Categories
        function renderCategories() {
            // Keep the "+ Add Category" button
            const addBtn = categoryContainer.firstElementChild;
            categoryContainer.innerHTML = '';
            categoryContainer.appendChild(addBtn);

            categoriesData.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-full text-sm font-medium transition-all backdrop-blur-sm ${
                    state.category === cat 
                        ? 'bg-[#F6C96C] text-[#1c1733] shadow-[0_0_15px_rgba(246,201,108,0.4)] border-transparent' 
                        : 'bg-white/5 text-gray-300 border border-white/10 hover:bg-white/10'
                }`;
                btn.innerText = cat;
                btn.onclick = () => {
                    state.category = cat;
                    renderCategories();
                };
                categoryContainer.appendChild(btn);
            });
        }

        // Render Payment Modes
        function renderPaymentModes() {
            paymentContainer.innerHTML = '';
            paymentModesData.forEach(mode => {
                const btn = document.createElement('button');
                btn.className = `py-3 px-4 rounded-2xl text-sm font-medium transition-all flex items-center justify-center border backdrop-blur-sm ${
                    state.paymentMode === mode 
                        ? 'border-[#F6C96C] bg-[#F6C96C]/10 text-[#F6C96C] shadow-[0_0_10px_rgba(246,201,108,0.2)]' 
                        : 'border-white/10 bg-white/5 text-gray-300 hover:bg-white/10'
                }`;
                btn.innerText = mode;
                btn.onclick = () => {
                    state.paymentMode = mode;
                    renderPaymentModes();
                };
                paymentContainer.appendChild(btn);
            });
        }

        // Render Items List
        function renderItems() {
            itemsContainer.innerHTML = '';
            state.items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'flex gap-2 items-center bg-white/5 border border-white/10 p-2 rounded-2xl backdrop-blur-sm';
                
                row.innerHTML = `
                    <div class="w-8 flex justify-center text-xs font-bold text-gray-400">${index + 1}.</div>
                    <input type="text" placeholder="Item Name" value="${item.name}" data-id="${item.id}" data-field="name" class="item-input flex-1 bg-black/20 border border-white/5 px-3 py-2.5 rounded-xl text-sm text-white placeholder-gray-500 outline-none focus:ring-1 focus:ring-[#F6C96C] transition-shadow">
                    <input type="number" placeholder="Qty" value="${item.qty}" data-id="${item.id}" data-field="qty" class="item-input w-16 bg-black/20 border border-white/5 px-2 py-2.5 rounded-xl text-sm text-white text-center placeholder-gray-500 outline-none focus:ring-1 focus:ring-[#F6C96C] transition-shadow">
                    <input type="number" placeholder="Price" value="${item.amount}" data-id="${item.id}" data-field="amount" class="item-input w-20 bg-black/20 border border-white/5 px-2 py-2.5 rounded-xl text-sm text-white text-center placeholder-gray-500 outline-none focus:ring-1 focus:ring-[#F6C96C] transition-shadow">
                `;
                itemsContainer.appendChild(row);
            });
        }

        // Event Listeners Setup
        function initApp() {
            // Init Values
            dateInput.value = state.date;
            renderCategories();
            renderPaymentModes();
            renderItems();
            updateTotal();

            // Date Change
            dateInput.addEventListener('change', (e) => {
                state.date = e.target.value;
            });

            // Description Change
            descriptionInput.addEventListener('input', (e) => {
                state.description = e.target.value;
            });

            // Add Item
            addItemBtn.addEventListener('click', () => {
                state.items.push({ id: Date.now(), name: '', qty: '', amount: '' });
                renderItems();
            });

            // Handle Input Changes dynamically (Event Delegation)
            itemsContainer.addEventListener('input', (e) => {
                if (e.target.classList.contains('item-input')) {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    const field = e.target.getAttribute('data-field');
                    
                    const itemIndex = state.items.findIndex(i => i.id === id);
                    if (itemIndex > -1) {
                        state.items[itemIndex][field] = e.target.value;
                        if(field === 'qty' || field === 'amount') {
                            updateTotal();
                        }
                    }
                }
            });

            // File Upload
            uploadZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    state.fileName = e.target.files[0].name;
                    fileNameDisplay.innerText = state.fileName;
                    fileNameDisplay.classList.replace('text-gray-200', 'text-[#F6C96C]');
                } else {
                    state.fileName = '';
                    fileNameDisplay.innerText = "Tap to upload receipt";
                    fileNameDisplay.classList.replace('text-[#F6C96C]', 'text-gray-200');
                }
            });

            // Save & Show Preview
            saveBtn.addEventListener('click', () => {
                if (!state.date || !state.category || state.items.length === 0 || !state.paymentMode) {
                    // Feedback for dark mode
                    const originalText = saveBtn.innerText;
                    saveBtn.innerText = "Fill required fields!";
                    saveBtn.classList.replace('from-[#F6C96C]', 'from-red-400');
                    saveBtn.classList.replace('to-[#e8b54e]', 'to-red-500');
                    saveBtn.classList.replace('text-[#1c1733]', 'text-white');
                    setTimeout(() => {
                        saveBtn.innerText = originalText;
                        saveBtn.classList.replace('from-red-400', 'from-[#F6C96C]');
                        saveBtn.classList.replace('to-red-500', 'to-[#e8b54e]');
                        saveBtn.classList.replace('text-white', 'text-[#1c1733]');
                    }, 2000);
                    return;
                }

                // Populate Preview Data
                previewDate.innerText = state.date;
                previewCategory.innerText = state.category;
                previewPayment.innerText = state.paymentMode;
                previewTotal.innerText = `$${state.total.toFixed(2)}`;

                previewItems.innerHTML = '';
                state.items.filter(i => i.name).forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between text-sm mb-1';
                    const lineTotal = (parseFloat(item.qty || 0) * parseFloat(item.amount || 0)).toFixed(2);
                    row.innerHTML = `
                        <span class="text-gray-200 font-light">${item.qty}x ${item.name}</span>
                        <span class="font-medium text-white">$${lineTotal}</span>
                    `;
                    previewItems.appendChild(row);
                });

                previewModal.classList.remove('hidden');
            });

            // Edit (Hide Preview)
            editBtn.addEventListener('click', () => {
                previewModal.classList.add('hidden');
            });

            // Submit (Show Success)
            submitBtn.addEventListener('click', () => {
                previewModal.classList.add('hidden');
                successScreen.classList.remove('hidden');
                mainScreen.style.display = 'none'; // Hide main to prevent scrolling
            });

            // Reset & Add Another
            addAnotherBtn.addEventListener('click', () => {
                // Reset State
                state.date = new Date().toISOString().split('T')[0];
                state.category = '';
                state.items = [{ id: Date.now(), name: '', qty: '', amount: '' }];
                state.paymentMode = '';
                state.description = '';
                state.fileName = '';
                state.total = 0;

                // Reset UI
                dateInput.value = state.date;
                descriptionInput.value = '';
                fileInput.value = '';
                fileNameDisplay.innerText = "Tap to upload receipt";
                fileNameDisplay.classList.replace('text-[#F6C96C]', 'text-gray-200');
                
                renderCategories();
                renderPaymentModes();
                renderItems();
                updateTotal();

                // Switch Screens
                successScreen.classList.add('hidden');
                mainScreen.style.display = 'block';
            });
        }

        // Boot App
        initApp();
    </script>
</body>
</html>
