                ? { ...cat, title: '4. Hawan Items' } 
                : cat
            );
          } catch (e) {
            return INITIAL_DATA;
          }
        }
        return INITIAL_DATA;
      });

      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [isAddTableModalOpen, setIsAddTableModalOpen] = useState(false);
      const [newTableTitle, setNewTableTitle] = useState('');
      
      const [isDeleteTableModalOpen, setIsDeleteTableModalOpen] = useState(false);
      const [tableToDelete, setTableToDelete] = useState('');
      const [showDeleteWarning, setShowDeleteWarning] = useState(false);

      const [past, setPast] = useState([]);
      const [future, setFuture] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);
      const [listeningState, setListeningState] = useState(null); 
      const [selectedRow, setSelectedRow] = useState(null);
      const [itemToDelete, setItemToDelete] = useState(null);
      const [activeCategory, setActiveCategory] = useState('cat-1');
      const [searchQuery, setSearchQuery] = useState('');

      // --- Column Resizing / Column Management State ---
      const [colWidths, setColWidths] = useState({
        sno: 40,
        items: 280,
        actual: 120,
        oldStock: 110,
        purchaseQuantity: 130,
        actions: 70
      });
      // Order of columns as they appear left-to-right (supports inserting/removing columns)
      const [colOrder, setColOrder] = useState(['sno', 'items', 'actual', 'oldStock', 'purchaseQuantity', 'actions']);
      // Display labels for each column header
      const [colLabels, setColLabels] = useState({
        sno: 'S.NO',
        items: 'ITEMS',
        actual: 'ACTUAL QTY',
        oldStock: 'OLD STOCK',
        purchaseQuantity: 'PURCHASE QTY',
        actions: 'ACTIONS'
      });
      // Maps a column key to the underlying item field it reads/writes (custom columns use their own key as the field)
      const [colFieldMap, setColFieldMap] = useState({
        items: 'name',
        actual: 'quantity',
        oldStock: 'oldStock',
        purchaseQuantity: 'purchaseQuantity'
      });
      const [hiddenCols, setHiddenCols] = useState([]);
      const [colClipboard, setColClipboard] = useState(null); // { colKey, field, values: { itemId: value } }
      const [colMenuOpen, setColMenuOpen] = useState(null); // colKey whose options menu is open
      const [columnFilters, setColumnFilters] = useState({}); // { colKey: string[] of selected/checked values }
      const [filterPanelOpen, setFilterPanelOpen] = useState(null); // colKey whose Excel-style filter card is open
      const [filterSearch, setFilterSearch] = useState('');
      const [filterDraftSelected, setFilterDraftSelected] = useState(null); // Set draft while panel is open
      const [isSaving, setIsSaving] = useState(false);
      const fileInputRef = useRef(null);

      // --- Table Heading 3-dot menu / Swap Item (drag-to-reorder) state ---
      const [tableMenuOpen, setTableMenuOpen] = useState(null); // categoryId whose 3-dot menu is open
      const [swapModeCategories, setSwapModeCategories] = useState({}); // { categoryId: true/false }
      const [draggedItem, setDraggedItem] = useState(null); // { categoryId, itemId }
      const [heldHandleItemId, setHeldHandleItemId] = useState(null); // itemId currently held (green highlight)

      const [selectedCol, setSelectedCol] = useState(null);
      const [isResizing, setIsResizing] = useState(null);
      const startXRef = useRef(null);
      const startWidthRef = useRef(null);

      useEffect(() => {
        const handleMove = (e) => {
          if (!isResizing) return;
          const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
          const deltaX = clientX - startXRef.current;
          const newWidth = Math.max(40, startWidthRef.current + deltaX); // Min width 40px
          setColWidths(prev => ({ ...prev, [isResizing]: newWidth }));
        };

        const handleEnd = () => {
          if (isResizing) {
            setIsResizing(null);
            document.body.style.cursor = 'default';
          }
        };

        if (isResizing) {
          document.body.style.cursor = 'col-resize';
          window.addEventListener('mousemove', handleMove);
          window.addEventListener('mouseup', handleEnd);
          window.addEventListener('touchmove', handleMove, { passive: false });
          window.addEventListener('touchend', handleEnd);
        }

        return () => {
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleEnd);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleEnd);
        };
      }, [isResizing]);

      const startResize = (e, colKey) => {
        e.stopPropagation();
        setIsResizing(colKey);
        startXRef.current = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        startWidthRef.current = colWidths[colKey];
      };

      const handleColSelect = (colKey) => {
        if (selectedCol === colKey && colMenuOpen === colKey) {
          setColMenuOpen(null);
          setSelectedCol(null);
        } else {
          setSelectedCol(colKey);
          setColMenuOpen(colKey);
        }
      };

      const closeColMenu = () => {
        setColMenuOpen(null);
        setSelectedCol(null);
      };
      
      // Global deselect listener
      useEffect(() => {
        const handleClickOutside = (e) => {
          // Deselect if we are not resizing and didn't click on a header or its options menu
          if (!isResizing && !e.target.closest('.cursor-pointer') && !e.target.closest('[data-col-menu]')) {
            setSelectedCol(null);
            setColMenuOpen(null);
            setFilterPanelOpen(null);
            setFilterDraftSelected(null);
            setTableMenuOpen(null);
          }
        };
        window.addEventListener('click', handleClickOutside);
        return () => window.removeEventListener('click', handleClickOutside);
      }, [isResizing]);

      const getHeaderClasses = (colKey) => {
        const isCentered = colKey === 'sno' || colKey === 'actions';
        const alignment = isCentered ? 'justify-center' : 'justify-start pl-2 sm:pl-3';
        return `shrink-0 flex items-center relative cursor-pointer transition-colors select-none ${alignment} ${selectedCol === colKey ? 'bg-orange-200/60' : 'hover:bg-orange-100/50'}`;
      };

      const visibleColOrder = () => colOrder.filter(k => !hiddenCols.includes(k));

      const renderResizeHandles = (colKey) => {
        if (selectedCol !== colKey) return null;

        const visible = visibleColOrder();
        const idx = visible.indexOf(colKey);
        const prevCol = idx > 0 ? visible[idx - 1] : null;

        return (
          <>
            {/* Left Handle */}
            {prevCol && (
              <div 
                onMouseDown={(e) => startResize(e, prevCol)}
                onTouchStart={(e) => startResize(e, prevCol)}
                className="absolute -left-2 top-0 bottom-0 w-4 bg-orange-500 cursor-col-resize z-20 shadow-md flex items-center justify-center hover:bg-orange-600 active:bg-orange-700 transition-colors"
              >
                <div className="w-0.5 h-1/3 bg-white rounded-full"></div>
              </div>
            )}
            {/* Right Handle */}
            <div 
              onMouseDown={(e) => startResize(e, colKey)}
              onTouchStart={(e) => startResize(e, colKey)}
              className="absolute -right-2 top-0 bottom-0 w-4 bg-orange-500 cursor-col-resize z-20 shadow-md flex items-center justify-center hover:bg-orange-600 active:bg-orange-700 transition-colors"
            >
              <div className="w-0.5 h-1/3 bg-white rounded-full"></div>
            </div>
          </>
        );
      };

      // Smart Math Engine for Unit Conversion and Subtraction
      const calculatePurchaseQty = (actual, old) => {
        try {
          if (!actual) return '';
          // If no old stock, purchase qty equals actual qty
          if (!old || old.trim() === '') return actual; 

          const parse = (str) => {
            // Convert fractions (1/2) to decimals (0.5) for math
            let s = String(str).toLowerCase().trim().replace(/1\/2/g, '0.5').replace(/1\/4/g, '0.25').replace(/3\/4/g, '0.75');
            const match = s.match(/^([\d\.]+)\s*(.*)$/);
            if (!match) return null;
            
            const num = parseFloat(match[1]);
            if (isNaN(num)) return null;
            
            let rawUnit = match[2].trim();
            // Normalize plurals (e.g., "no's", "tins" -> "no", "tin") for comparison
            let type = rawUnit.replace(/[^a-z]/g, '');
            if (type.endsWith('s')) type = type.slice(0, -1);

            let base = num;
            // Standardize metric units
            if (['kg', 'kilogram'].includes(type)) { base = num * 1000; type = 'weight'; }
            else if (['g', 'gm', 'gram'].includes(type)) { base = num; type = 'weight'; }
            else if (['l', 'liter', 'litre'].includes(type)) { base = num * 1000; type = 'volume'; }
            else if (['ml', 'milliliter'].includes(type)) { base = num; type = 'volume'; }
            
            return { base, type, origUnit: match[2].trim() || '' };
          };

          const a = parse(actual);
          const o = parse(old);

          // Only proceed if types match securely (can't subtract bags from kgs)
          if (!a || !o || a.type !== o.type) return null;

          const diff = a.base - o.base;
          if (diff <= 0) return '0 ' + a.origUnit;

          // Format back cleanly based on outcome volume
          if (a.type === 'weight') {
            if (diff >= 1000) return parseFloat((diff / 1000).toFixed(3)) + ' kg';
            return parseFloat(diff.toFixed(2)) + ' g';
          }
          if (a.type === 'volume') {
            if (diff >= 1000) return parseFloat((diff / 1000).toFixed(3)) + ' l';
            return parseFloat(diff.toFixed(2)) + ' ml';
          }

          // Non-metric fallback
          return parseFloat(diff.toFixed(2)) + (a.origUnit ? ' ' + a.origUnit : '');
        } catch (e) {
          return null;
        }
      };

      const getIconForCategory = (id) => {
        if(id === 'cat-1') return Icons.ShoppingCart;
        if(id === 'cat-2') return Icons.Vegetables;
        if(id === 'cat-3') return Icons.Temple;
        if(id === 'cat-4') return Icons.Flame;
        return Icons.Grid;
      };

      const categoryNavItems = data.map(cat => ({
        id: cat.id,
        name: cat.title.replace(/^\d+\.\s*/, ''),
        icon: getIconForCategory(cat.id)
      }));

      const scrollToCategory = (categoryId) => {
        setActiveCategory(categoryId);
        const element = document.getElementById(categoryId);
        if (element) {
          const stickyBar = document.getElementById('sticky-top-bar');
          const headerOffset = stickyBar ? stickyBar.getBoundingClientRect().bottom : 230; 
          const elementPosition = element.getBoundingClientRect().top;
          const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
          
          window.scrollTo({
            top: offsetPosition,
            behavior: "smooth"
          });
        }
      };

      const recognitionRef = useRef(null);
      const globalHeaderScrollRef = useRef(null);
      const [showGlobalHeader, setShowGlobalHeader] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          const stickyBar = document.getElementById('sticky-top-bar');
          const headerOffset = stickyBar ? stickyBar.getBoundingClientRect().bottom : 230; 
          
          let currentActiveId = activeCategory;
          let shouldShowGlobal = false;
          let activeScrollId = null;

          for (const cat of data) {
            const element = document.getElementById(cat.id);
            const headerElement = document.getElementById(`native-header-${cat.id}`);
            
            if (element) {
              const rect = element.getBoundingClientRect();
              if (rect.top <= headerOffset + 50 && rect.bottom >= headerOffset) {
                currentActiveId = cat.id;
              }
              
              if (headerElement) {
                const headerRect = headerElement.getBoundingClientRect();
                // If native header hides above sticky bar, but table items are still visible below
                if (headerRect.bottom <= headerOffset && rect.bottom > headerOffset + 40) {
                  shouldShowGlobal = true;
                  activeScrollId = cat.id;
                }
              }
            }
          }

          if (currentActiveId !== activeCategory) {
            setActiveCategory(currentActiveId);
            const navElement = document.getElementById(`nav-${currentActiveId}`);
            if (navElement && navElement.parentElement) {
              const container = navElement.parentElement;
              const scrollLeft = navElement.offsetLeft - (container.clientWidth / 2) + (navElement.clientWidth / 2);
              container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
            }
          }
          
          setShowGlobalHeader(prev => prev !== shouldShowGlobal ? shouldShowGlobal : prev);
          
          // Sync the horizontal scroll instantly if visible
          if (shouldShowGlobal && activeScrollId && globalHeaderScrollRef.current) {
            const activeContainer = document.getElementById(`scroll-container-${activeScrollId}`);
            if (activeContainer) {
              globalHeaderScrollRef.current.scrollLeft = activeContainer.scrollLeft;
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, [activeCategory, data]);

      useEffect(() => {
        const handleScroll = () => {
          const headerOffset = 240; 
          let currentActiveId = activeCategory;

          for (const cat of categoryNavItems) {
            const element = document.getElementById(cat.id);
            if (element) {
              const rect = element.getBoundingClientRect();
              if (rect.top <= headerOffset + 50 && rect.bottom >= headerOffset) {
                currentActiveId = cat.id;
              }
            }
          }

          if (currentActiveId !== activeCategory) {
            setActiveCategory(currentActiveId);
            const navElement = document.getElementById(`nav-${currentActiveId}`);
            if (navElement && navElement.parentElement) {
              const container = navElement.parentElement;
              const scrollLeft = navElement.offsetLeft - (container.clientWidth / 2) + (navElement.clientWidth / 2);
              container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, [activeCategory]);

      useEffect(() => {
        localStorage.setItem('smartInventoryData', JSON.stringify(data));
      }, [data]);

      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const updateData = (updaterFn) => {
        setData(prevData => {
          const nextData = updaterFn(prevData);
          setPast(prevPast => [...prevPast, prevData]);
          setFuture([]);
          return nextData;
        });
      };

      const handleUndo = () => {
        if (past.length === 0) return;
        const previous = past[past.length - 1];
        setPast(past.slice(0, past.length - 1));
        setFuture([data, ...future]);
        setData(previous);
      };

      const handleRedo = () => {
        if (future.length === 0) return;
        const next = future[0];
        setFuture(future.slice(1));
        setPast([...past, data]);
        setData(next);
      };

      const toggleVoiceInput = (categoryId, itemId, field) => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast("Voice recognition is not supported in this browser.");
          return;
        }

        if (listeningState && listeningState.categoryId === categoryId && listeningState.itemId === itemId && listeningState.field === field) {
          if (recognitionRef.current) recognitionRef.current.stop();
          setListeningState(null);
          return;
        }

        if (recognitionRef.current) recognitionRef.current.stop();

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US'; 

        recognition.onstart = () => setListeningState({ categoryId, itemId, field });
        recognition.onresult = (event) => handleVoiceResult(categoryId, itemId, field, event.results[0][0].transcript);
        recognition.onerror = () => setListeningState(null);
        recognition.onend = () => setListeningState(null);

        recognitionRef.current = recognition;
        try { recognition.start(); } catch (e) { setListeningState(null); }
      };

      const handleVoiceResult = (categoryId, itemId, field, transcript) => {
        if (categoryId === 'search') {
          setSearchQuery(prev => prev.trim().length > 0 ? `${prev} ${transcript}` : transcript);
          return;
        }

        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.map(item => {
              if (item.id !== itemId) return item;
              const currentValue = item[field] || '';
              const newValue = currentValue.trim().length > 0 ? `${currentValue} ${transcript}` : transcript;
              
              const updatedItem = { ...item, [field]: newValue };

              // Auto-calculate on voice input
              if (field === 'quantity' || field === 'oldStock') {
                const actual = updatedItem.quantity;
                const old = updatedItem.oldStock;
                const calc = calculatePurchaseQty(actual, old);
                if (calc !== null) updatedItem.purchaseQuantity = calc;
              }

              return updatedItem;
            })
          };
        }));
      };

      const handleInputChange = (categoryId, itemId, field, value) => {
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          return {
            ...category,
            items: category.items.map(item => {
              if (item.id !== itemId) return item;
              
              const updatedItem = { ...item, [field]: value };
              
              // Auto-calculate on typing
              if (field === 'quantity' || field === 'oldStock') {
                const actual = updatedItem.quantity;
                const old = updatedItem.oldStock;
                const calc = calculatePurchaseQty(actual, old);
                if (calc !== null) updatedItem.purchaseQuantity = calc;
              }

              return updatedItem;
            })
          };
        }));
      };

      // --- Column Actions: Cut / Copy / Paste / Clear / Insert / Delete / Sort / Hide / Unhide ---
      const getColLabel = (colKey) => colLabels[colKey] || colKey;

      const handleColCopy = (colKey) => {
        const field = colFieldMap[colKey] || colKey;
        const values = {};
        data.forEach(cat => cat.items.forEach(item => { values[item.id] = item[field] || ''; }));
        setColClipboard({ colKey, field, values });
        showToast(`Copied column "${getColLabel(colKey)}"`);
      };

      const handleColClear = (colKey, silent) => {
        const field = colFieldMap[colKey] || colKey;
        updateData(prevData => prevData.map(cat => ({
          ...cat,
          items: cat.items.map(item => ({ ...item, [field]: '' }))
        })));
        if (!silent) showToast(`Cleared column "${getColLabel(colKey)}"`);
      };

      const handleColCut = (colKey) => {
        handleColCopy(colKey);
        handleColClear(colKey, true);
        showToast(`Cut column "${getColLabel(colKey)}"`);
      };

      const handleColPaste = (colKey) => {
        if (!colClipboard) { showToast('Nothing to paste'); return; }
        const field = colFieldMap[colKey] || colKey;
        updateData(prevData => prevData.map(cat => ({
          ...cat,
          items: cat.items.map(item => ({
            ...item,
            [field]: Object.prototype.hasOwnProperty.call(colClipboard.values, item.id) ? colClipboard.values[item.id] : (item[field] || '')
          }))
        })));
        showToast(`Pasted into column "${getColLabel(colKey)}"`);
      };

      const handleSortColumn = (colKey, direction) => {
        const field = colFieldMap[colKey] || colKey;
        updateData(prevData => prevData.map(cat => {
          const sortedItems = [...cat.items].sort((a, b) => {
            const av = (a[field] || '').toString();
            const bv = (b[field] || '').toString();
            const an = parseFloat(av);
            const bn = parseFloat(bv);
            let cmp;
            if (!isNaN(an) && !isNaN(bn) && av.trim() !== '' && bv.trim() !== '') {
              cmp = an - bn;
            } else {
              cmp = av.localeCompare(bv, undefined, { sensitivity: 'base', numeric: true });
            }
            return direction === 'asc' ? cmp : -cmp;
          });
          return { ...cat, items: sortedItems };
        }));
        showToast(`Sorted "${getColLabel(colKey)}" ${direction === 'asc' ? 'ascending' : 'descending'}`);
      };

      const BLANK_TOKEN = '__BLANK__';

      // Returns the sorted list of distinct values for a column, with a trailing (Blanks) entry if applicable
      const getColumnValueList = (colKey) => {
        const field = colFieldMap[colKey] || colKey;
        const values = new Set();
        let hasBlank = false;
        data.forEach(cat => cat.items.forEach(item => {
          const v = (item[field] || '').toString().trim();
          if (v === '') { hasBlank = true; } else { values.add(v); }
        }));
        const sorted = Array.from(values).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
        return hasBlank ? [...sorted, BLANK_TOKEN] : sorted;
      };

      const openFilterPanel = (colKey) => {
        const fullList = getColumnValueList(colKey);
        const existing = columnFilters[colKey];
        const initialSelected = existing ? new Set(existing) : new Set(fullList);
        setFilterDraftSelected(initialSelected);
        setFilterSearch('');
        setFilterPanelOpen(colKey);
      };

      const applyColumnFilter = (colKey) => {
        const fullList = getColumnValueList(colKey);
        const draft = filterDraftSelected || new Set(fullList);
        setColumnFilters(prev => {
          const next = { ...prev };
          if (draft.size >= fullList.length) {
            delete next[colKey]; // everything selected = no filter
          } else {
            next[colKey] = Array.from(draft);
          }
          return next;
        });
        setFilterPanelOpen(null);
        setFilterDraftSelected(null);
        showToast(`Filter applied on "${getColLabel(colKey)}"`);
      };

      const clearColumnFilterPanel = (colKey) => {
        setColumnFilters(prev => {
          const next = { ...prev };
          delete next[colKey];
          return next;
        });
        setFilterPanelOpen(null);
        setFilterDraftSelected(null);
        showToast(`Cleared filter on "${getColLabel(colKey)}"`);
      };

      const cancelFilterPanel = () => {
        setFilterPanelOpen(null);
        setFilterDraftSelected(null);
      };

      const renderFilterPanel = (colKey) => {
        const fullList = getColumnValueList(colKey);
        const searchLower = filterSearch.trim().toLowerCase();
        const visibleList = searchLower === ''
          ? fullList
          : fullList.filter(v => (v === BLANK_TOKEN ? '(blanks)' : v.toLowerCase()).includes(searchLower));

        const draft = filterDraftSelected || new Set(fullList);
        const allVisibleChecked = visibleList.length > 0 && visibleList.every(v => draft.has(v));

        const toggleValue = (v) => {
          setFilterDraftSelected(prev => {
            const next = new Set(prev || fullList);
            if (next.has(v)) next.delete(v); else next.add(v);
            return next;
          });
        };

        const toggleSelectAll = () => {
          setFilterDraftSelected(prev => {
            const next = new Set(prev || fullList);
            if (allVisibleChecked) {
              visibleList.forEach(v => next.delete(v));
            } else {
              visibleList.forEach(v => next.add(v));
            }
            return next;
          });
        };

        return (
          <div
            data-col-menu="true"
            onClick={(e) => e.stopPropagation()}
            className="absolute top-full left-0 mt-1 w-56 bg-white rounded-lg shadow-2xl border border-stone-200 z-40 p-2 no-print normal-case text-stone-700"
          >
            <div className="relative mb-2">
              <input
                type="text"
                value={filterSearch}
                onChange={(e) => setFilterSearch(e.target.value)}
                placeholder="Search"
                className="w-full text-xs border border-stone-300 rounded px-2 py-1.5 pr-7 focus:outline-none focus:ring-1 focus:ring-orange-400"
              />
              <Icons.Search className="w-3.5 h-3.5 text-stone-400 absolute right-2 top-1/2 -translate-y-1/2" />
            </div>

            <label className="flex items-center gap-2 px-1 py-1 text-xs font-semibold border-b border-stone-100 mb-1 cursor-pointer">
              <input type="checkbox" checked={allVisibleChecked} onChange={toggleSelectAll} className="accent-orange-500" />
              (Select All)
            </label>

            <div className="max-h-40 overflow-y-auto flex flex-col gap-0.5 pr-1">
              {visibleList.length === 0 ? (
                <div className="text-xs text-stone-400 px-1 py-2 text-center">No matches</div>
              ) : visibleList.map(v => (
                <label key={v} className="flex items-center gap-2 px-1 py-0.5 text-xs hover:bg-orange-50 rounded cursor-pointer">
                  <input type="checkbox" checked={draft.has(v)} onChange={() => toggleValue(v)} className="accent-orange-500" />
                  <span className="truncate">{v === BLANK_TOKEN ? '(Blanks)' : v}</span>
                </label>
              ))}
            </div>

            <div className="flex items-center justify-between gap-2 mt-2 pt-2 border-t border-stone-100">
              <button onClick={() => clearColumnFilterPanel(colKey)} className="text-[11px] font-semibold text-stone-400 hover:text-red-500">Clear</button>
              <div className="flex gap-1.5">
                <button onClick={cancelFilterPanel} className="text-xs font-semibold px-2.5 py-1 rounded border border-stone-200 text-stone-500 hover:bg-stone-50">Cancel</button>
                <button onClick={() => applyColumnFilter(colKey)} className="text-xs font-semibold px-2.5 py-1 rounded bg-orange-500 text-white hover:bg-orange-600">OK</button>
              </div>
            </div>
          </div>
        );
      };

      const handleHideColumn = (colKey) => {
        if (colKey === 'sno' || colKey === 'actions') { showToast("This column can't be hidden"); return; }
        setHiddenCols(prev => prev.includes(colKey) ? prev : [...prev, colKey]);
        showToast(`Hid column "${getColLabel(colKey)}"`);
      };

      const handleUnhideColumn = (colKey) => {
        setHiddenCols(prev => prev.filter(k => k !== colKey));
        showToast(`Unhid column "${getColLabel(colKey)}"`);
      };

      const handleInsertColumn = (colKey, side) => {
        const label = window.prompt('Name for the new column:', 'New Column');
        if (label === null) return; // cancelled
        const newKey = `col_${Date.now()}`;
        setColOrder(prev => {
          const idx = prev.indexOf(colKey);
          const insertAt = side === 'left' ? idx : idx + 1;
          const next = [...prev];
          next.splice(insertAt, 0, newKey);
          return next;
        });
        setColLabels(prev => ({ ...prev, [newKey]: (label.trim() || 'New Column').toUpperCase() }));
        setColWidths(prev => ({ ...prev, [newKey]: 130 }));
        setColFieldMap(prev => ({ ...prev, [newKey]: newKey }));
        updateData(prevData => prevData.map(cat => ({
          ...cat,
          items: cat.items.map(item => ({ ...item, [newKey]: '' }))
        })));
        showToast('Column inserted');
      };

      const handleDeleteColumn = (colKey) => {
        if (colKey === 'sno' || colKey === 'actions') { showToast("This column can't be deleted"); return; }
        if (!window.confirm(`Delete column "${getColLabel(colKey)}"? This will remove its data from every row.`)) return;
        const field = colFieldMap[colKey] || colKey;
        setColOrder(prev => prev.filter(k => k !== colKey));
        setHiddenCols(prev => prev.filter(k => k !== colKey));
        updateData(prevData => prevData.map(cat => ({
          ...cat,
          items: cat.items.map(item => {
            const rest = { ...item };
            delete rest[field];
            return rest;
          })
        })));
        showToast(`Deleted column "${getColLabel(colKey)}"`);
      };

      const runColAction = (action, colKey) => {
        if (action === 'filter') {
          openFilterPanel(colKey);
          setColMenuOpen(null);
          return;
        }
        switch (action) {
          case 'cut': handleColCut(colKey); break;
          case 'copy': handleColCopy(colKey); break;
          case 'paste': handleColPaste(colKey); break;
          case 'clear': handleColClear(colKey); break;
          case 'insertLeft': handleInsertColumn(colKey, 'left'); break;
          case 'insertRight': handleInsertColumn(colKey, 'right'); break;
          case 'delete': handleDeleteColumn(colKey); break;
          case 'sortAsc': handleSortColumn(colKey, 'asc'); break;
          case 'sortDesc': handleSortColumn(colKey, 'desc'); break;
          case 'hide': handleHideColumn(colKey); break;
          case 'unhide': handleUnhideColumn(colKey); break;
          default: break;
        }
        closeColMenu();
      };

      const renderColMenu = (colKey) => {
        const isData = colKey !== 'sno' && colKey !== 'actions';
        const isHidden = hiddenCols.includes(colKey);
        const itemClass = "w-full text-left px-3 py-1.5 text-xs font-semibold text-stone-600 hover:bg-orange-50 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors";
        return (
          <div
            data-col-menu="true"
            onClick={(e) => e.stopPropagation()}
            className="absolute top-full left-0 mt-1 w-40 bg-white rounded-lg shadow-2xl border border-stone-200 z-30 py-1 no-print normal-case"
          >
            <button disabled={!isData} onClick={() => runColAction('cut', colKey)} className={itemClass}>Cut</button>
            <button disabled={!isData} onClick={() => runColAction('copy', colKey)} className={itemClass}>Copy</button>
            <button disabled={!isData || !colClipboard} onClick={() => runColAction('paste', colKey)} className={itemClass}>Paste</button>
            <button disabled={!isData} onClick={() => runColAction('clear', colKey)} className={itemClass}>Clear</button>
            <div className="my-1 border-t border-stone-100"></div>
            <button onClick={() => runColAction('insertLeft', colKey)} className={itemClass}>Insert (Left)</button>
            <button onClick={() => runColAction('insertRight', colKey)} className={itemClass}>Insert (Right)</button>
            <button disabled={!isData} onClick={() => runColAction('delete', colKey)} className={`${itemClass} text-red-500`}>Delete</button>
            <div className="my-1 border-t border-stone-100"></div>
            <button disabled={!isData} onClick={() => runColAction('sortAsc', colKey)} className={itemClass}>Sort Ascending</button>
            <button disabled={!isData} onClick={() => runColAction('sortDesc', colKey)} className={itemClass}>Sort Descending</button>
            <div className="my-1 border-t border-stone-100"></div>
            <button disabled={!isData} onClick={() => runColAction('filter', colKey)} className={itemClass}>{columnFilters[colKey] ? 'Filter (active)' : 'Filter'}</button>
            <div className="my-1 border-t border-stone-100"></div>
            <button disabled={isHidden} onClick={() => runColAction('hide', colKey)} className={itemClass}>Hide</button>
            <button disabled={!isHidden} onClick={() => runColAction('unhide', colKey)} className={itemClass}>Unhide</button>
          </div>
        );
      };

      // Generic header cell (used by both the sticky global header and each category's native header)
      const renderHeaderCell = (colKey) => {
        const width = colWidths[colKey] ?? 130;
        const isHidden = hiddenCols.includes(colKey);
        const isFirstVisible = visibleColOrder()[0] === colKey;

        if (isHidden) {
          return (
            <div
              key={colKey}
              onClick={(e) => { e.stopPropagation(); handleColSelect(colKey); }}
              style={{ width: 12, minWidth: 12 }}
              title={`${getColLabel(colKey)} (hidden) — click to manage`}
              className="shrink-0 relative border-l border-orange-300/60 bg-orange-100 hover:bg-orange-200 cursor-pointer flex items-center justify-center"
            >
              <span className="text-orange-400 text-[9px] leading-none">⋮</span>
              {colMenuOpen === colKey && renderColMenu(colKey)}
              {filterPanelOpen === colKey && renderFilterPanel(colKey)}
            </div>
          );
        }

        return (
          <div
            key={colKey}
            onClick={() => handleColSelect(colKey)}
            style={{ width, minWidth: width }}
            className={`${!isFirstVisible ? 'border-l border-orange-200/60' : ''} ${getHeaderClasses(colKey)}`}
          >
            <span className="w-full text-left flex items-center gap-1 truncate">
              {getColLabel(colKey)}
              {columnFilters[colKey] && <span title="Filter active" className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>}
            </span>
            {renderResizeHandles(colKey)}
            {colMenuOpen === colKey && renderColMenu(colKey)}
            {filterPanelOpen === colKey && renderFilterPanel(colKey)}
          </div>
        );
      };

      // Generic row cell (used for every row in every category)
      const renderRowCell = (colKey, category, item, index) => {
        const width = colWidths[colKey] ?? 130;
        const isHidden = hiddenCols.includes(colKey);

        if (isHidden) {
          return <div key={colKey} style={{ width: 12, minWidth: 12 }} className="shrink-0 border-l border-orange-100/40 bg-orange-50/60"></div>;
        }

        if (colKey === 'sno') {
          return (
            <div key={colKey} style={{ width, minWidth: width }} className={`shrink-0 flex items-center justify-center text-sm text-stone-400 font-semibold pt-1.5 transition-colors ${selectedCol === 'sno' ? 'bg-orange-200/40 shadow-[inset_0_0_0_1px_rgba(251,146,60,0.2)]' : ''}`}>
              {index + 1}
            </div>
          );
        }

        if (colKey === 'actions') {
          return (
            <div key={colKey} style={{ width, minWidth: width }} className={`shrink-0 flex items-center justify-evenly pt-1.5 px-1 no-print border-l border-orange-100/40 transition-colors ${selectedCol === 'actions' ? 'bg-orange-200/40 shadow-[inset_0_0_0_1px_rgba(251,146,60,0.2)]' : ''}`}>
              <button onClick={(e) => { e.stopPropagation(); insertRowAfter(category.id, index); }} className="text-stone-300 hover:text-orange-500 p-1">
                <Icons.Plus className="w-4 h-4" />
              </button>
              <button onClick={(e) => { e.stopPropagation(); requestDeleteRow(category.id, item.id); }} className="text-stone-300 hover:text-red-400 p-1">
                <Icons.Trash className="w-4 h-4" />
              </button>
            </div>
          );
        }

        const field = colFieldMap[colKey] || colKey;
        return (
          <div key={colKey} style={{ width, minWidth: width }} className={`shrink-0 px-1 sm:px-2 relative border-l border-orange-100/40 transition-colors ${selectedCol === colKey ? 'bg-orange-200/40 shadow-[inset_0_0_0_1px_rgba(251,146,60,0.2)]' : ''}`}>
            <input
              type="text"
              value={item[field] || ''}
              onChange={(e) => handleInputChange(category.id, item.id, field, e.target.value)}
              placeholder={getColLabel(colKey)}
              className="w-full bg-transparent border-none text-sm font-medium text-stone-800 placeholder-stone-300 focus:outline-none focus:ring-0 pr-7 py-1.5"
            />
            <button
              onClick={(e) => { e.stopPropagation(); toggleVoiceInput(category.id, item.id, field); }}
              className="absolute right-2 sm:right-3 top-1/2 transform -translate-y-1/2 text-stone-300 hover:text-orange-500 p-0.5 no-print"
            >
              {checkIsListening(category.id, item.id, field) ? <Icons.MicActive className="w-3.5 h-3.5" /> : <Icons.Mic className="w-3.5 h-3.5" />}
            </button>
          </div>
        );
      };

      const addRow = (categoryId) => {
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          const newItem = { id: `item-${Date.now()}`, name: '', quantity: '', purchaseQuantity: '', oldStock: '' };
          return { ...category, items: [...category.items, newItem] };
        }));
      };

      const insertRowAfter = (categoryId, index) => {
        updateData(prevData => prevData.map(category => {
          if (category.id !== categoryId) return category;
          const newItem = { id: `item-${Date.now()}`, name: '', quantity: '', purchaseQuantity: '', oldStock: '' };
          const newItems = [...category.items];
          newItems.splice(index + 1, 0, newItem);
          return { ...category, items: newItems };
        }));
      };

      const requestDeleteRow = (categoryId, itemId) => setItemToDelete({ categoryId, itemId });

      // --- Table Heading: "Swap Item (Up & Down)" toggle + drag-to-reorder ---
      const toggleSwapMode = (categoryId) => {
        setSwapModeCategories(prev => ({ ...prev, [categoryId]: !prev[categoryId] }));
      };

      const renderTableMenu = (categoryId) => {
        const enabled = !!swapModeCategories[categoryId];
        return (
          <div
            data-col-menu="true"
            onClick={(e) => e.stopPropagation()}
            className="absolute top-full right-0 mt-1 w-60 bg-white rounded-lg shadow-2xl border border-stone-200 z-40 p-3 no-print text-stone-700"
          >
            <div className="flex items-center justify-between gap-3">
              <span className="text-xs font-semibold">Swap Item (Up & Down)</span>
              <button
                onClick={() => toggleSwapMode(categoryId)}
                className={`relative w-10 h-5 rounded-full shrink-0 transition-colors ${enabled ? 'bg-emerald-500' : 'bg-stone-300'}`}
                title={enabled ? 'Turn off' : 'Turn on'}
              >
                <span className={`absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform ${enabled ? 'translate-x-5' : ''}`}></span>
              </button>
            </div>
            {enabled && (
              <p className="text-[10px] text-stone-400 mt-2 leading-snug">Hold the six dots next to any row and drag it up or down to reorder.</p>
            )}
          </div>
        );
      };

      const handleRowDragStart = (e, categoryId, itemId) => {
        setDraggedItem({ categoryId, itemId });
        setHeldHandleItemId(itemId);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', itemId); } catch (err) {}
      };

      const handleRowDragOver = (e, categoryId) => {
        if (!draggedItem || draggedItem.categoryId !== categoryId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleRowDrop = (e, categoryId, targetItemId) => {
        e.preventDefault();
        if (!draggedItem || draggedItem.categoryId !== categoryId || draggedItem.itemId === targetItemId) {
          setDraggedItem(null);
          setHeldHandleItemId(null);
          return;
        }
        updateData(prevData => prevData.map(cat => {
          if (cat.id !== categoryId) return cat;
          const items = [...cat.items];
          const fromIdx = items.findIndex(i => i.id === draggedItem.itemId);
          const toIdx = items.findIndex(i => i.id === targetItemId);
          if (fromIdx === -1 || toIdx === -1) return cat;
          const [moved] = items.splice(fromIdx, 1);
          items.splice(toIdx, 0, moved);
          return { ...cat, items };
        }));
        setDraggedItem(null);
        setHeldHandleItemId(null);
      };

      const handleRowDragEnd = () => {
        setDraggedItem(null);
        setHeldHandleItemId(null);
      };

      const confirmDeleteRow = () => {
        if (!itemToDelete) return;
        updateData(prevData => prevData.map(category => {
          if (category.id !== itemToDelete.categoryId) return category;
          return { ...category, items: category.items.filter(item => item.id !== itemToDelete.itemId) };
        }));
        setItemToDelete(null); 
      };

      const generateCSVContent = () => {
        let csv = "\uFEFF"; 
        data.forEach(cat => {
          csv += `"${cat.title.replace(/"/g, '""')}"\n`;
          csv += `"S.NO","ITEMS","ACTUAL QUANTITY","OLD STOCK","PURCHASE QUANTITY"\n`;
          
          if (cat.items.length === 0) {
            csv += `"","No items","","",""\n`;
          } else {
            cat.items.forEach((item, index) => {
              const safeName = (item.name || '').replace(/"/g, '""');
              const safeQty = (item.quantity || '').replace(/"/g, '""');
              const safePurchase = (item.purchaseQuantity || '').replace(/"/g, '""');
              const safeOld = (item.oldStock || '').replace(/"/g, '""');
              csv += `"${index + 1}","${safeName}","${safeQty}","${safeOld}","${safePurchase}"\n`;
            });
          }
          csv += `\n`; 
        });
        return csv;
      };

      const downloadCSV = () => {
        const csv = generateCSVContent();
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'LDSS_Mahoor_List.csv');
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast("Excel file downloaded successfully!");
        setIsSidebarOpen(false);
      };

      const getExcelFilename = () => {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const datePart = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()}`;
        const timePart = `${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
        return `LDSS_Mahoor_List_${datePart}_${timePart}.xlsx`;
      };

      const buildWorkbookFromData = () => {
        const wb = XLSX.utils.book_new();
        const dataCols = colOrder.filter(k => k !== 'sno' && k !== 'actions');
        const usedNames = {};

        const source = data.length > 0 ? data : [{ title: 'Sheet1', items: [] }];
        source.forEach(cat => {
          const header = ['S.NO', ...dataCols.map(k => getColLabel(k))];
          const rows = cat.items.map((item, idx) => [
            idx + 1,
            ...dataCols.map(k => item[colFieldMap[k] || k] || '')
          ]);
          const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);

          let sheetName = (cat.title || 'Sheet').replace(/[\\/\?\*\[\]:]/g, '').trim().substring(0, 28) || 'Sheet';
          if (usedNames[sheetName]) {
            usedNames[sheetName] += 1;
            sheetName = `${sheetName} (${usedNames[sheetName]})`;
          } else {
            usedNames[sheetName] = 1;
          }
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
        });
        return wb;
      };

      const handleSaveExcel = () => {
        if (typeof XLSX === 'undefined') {
          showToast('Excel library failed to load. Check your connection.');
          return;
        }
        setIsSaving(true);
        try {
          const wb = buildWorkbookFromData();
          const filename = getExcelFilename();
          XLSX.writeFile(wb, filename);
          showToast(`Saved as "${filename}"`);
        } catch (err) {
          console.error(err);
          showToast('Failed to save Excel file.');
        }
        setTimeout(() => setIsSaving(false), 1300);
      };

      const handleOpenFileClick = () => {
        if (fileInputRef.current) fileInputRef.current.click();
        setIsSidebarOpen(false);
      };

      const handleFileSelected = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (typeof XLSX === 'undefined') {
          showToast('Excel library failed to load. Check your connection.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bytes = new Uint8Array(evt.target.result);
            const wb = XLSX.read(bytes, { type: 'array' });

            const dataCols = colOrder.filter(k => k !== 'sno' && k !== 'actions');
            const labelToKey = {};
            dataCols.forEach(k => { labelToKey[getColLabel(k).toUpperCase().trim()] = k; });

            let nextColOrder = [...colOrder];
            let nextColLabels = { ...colLabels };
            let nextColFieldMap = { ...colFieldMap };

            const newCategories = wb.SheetNames.map((sheetName, sIdx) => {
              const sheet = wb.Sheets[sheetName];
              const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
              if (rows.length === 0) {
                return { id: `cat-${Date.now()}-${sIdx}`, title: sheetName, items: [] };
              }

              const headerRow = rows[0].map(h => (h || '').toString().toUpperCase().trim());
              const colKeysForRow = headerRow.map((label, colIdx) => {
                if (colIdx === 0) return 'sno';
                if (labelToKey[label]) return labelToKey[label];
                const newKey = `col_${Date.now()}_${sIdx}_${colIdx}`;
                nextColOrder = [...nextColOrder.filter(k => k !== 'actions'), newKey, 'actions'];
                nextColLabels[newKey] = label || `COLUMN ${colIdx}`;
                nextColFieldMap[newKey] = newKey;
                labelToKey[label] = newKey;
                return newKey;
              });

              const items = rows.slice(1).map((row, rIdx) => {
                const item = { id: `item-${Date.now()}-${sIdx}-${rIdx}`, name: '', quantity: '', oldStock: '', purchaseQuantity: '' };
                colKeysForRow.forEach((colKey, colIdx) => {
                  if (colKey === 'sno') return;
                  const field = nextColFieldMap[colKey] || colKey;
                  const cell = row[colIdx];
                  item[field] = cell === undefined || cell === null ? '' : cell.toString();
                });
                return item;
              });

              return { id: `cat-${Date.now()}-${sIdx}`, title: sheetName, items };
            });

            setColOrder(nextColOrder);
            setColLabels(nextColLabels);
            setColFieldMap(nextColFieldMap);
            updateData(() => newCategories);
            showToast(`Opened "${file.name}" successfully!`);
          } catch (err) {
            console.error(err);
            showToast('Failed to open file. Please select a valid Excel file.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const downloadPDF = () => {
        setIsSidebarOpen(false);
        showToast("Generating PDF... Please wait.");

        setTimeout(() => {
          const pdfContainer = document.createElement('div');
          pdfContainer.style.padding = '20px';
          pdfContainer.style.fontFamily = 'sans-serif';
          
          let htmlContent = `
            <div style="text-align:center; margin-bottom:20px;">
              <h1 style="color:#ea580c; font-size:24px; font-weight:bold; margin:0;">LDSS - Mahoor List</h1>
              <p style="color:#78716c; font-size:12px; margin-top:4px;">Generated on ${new Date().toLocaleDateString()}</p>
            </div>
          `;
          
          data.forEach(cat => {
            htmlContent += `
              <h2 style="background-color:#ea580c; color:white; padding:8px 12px; margin-top:24px; margin-bottom:0; font-size:14px; font-weight:bold; border-radius:8px 8px 0 0;">${cat.title}</h2>
              <table style="width:100%; border-collapse: collapse; text-align:left; font-size:12px;">
                <thead>
                  <tr style="background-color:#ffedd5; color:#9a3412;">
                    <th style="padding:8px 12px; border:1px solid #fdba74; width:8%;">S.NO</th>
                    <th style="padding:8px 12px; border:1px solid #fdba74; width:32%;">ITEMS</th>
                    <th style="padding:8px 12px; border:1px solid #fdba74; width:20%;">ACTUAL QTY</th>
                    <th style="padding:8px 12px; border:1px solid #fdba74; width:20%;">OLD STOCK</th>
                    <th style="padding:8px 12px; border:1px solid #fdba74; width:20%;">PURCHASE QTY</th>
                  </tr>
                </thead>
                <tbody>
            `;
            
            if (cat.items.length === 0) {
              htmlContent += `<tr><td colspan="5" style="text-align:center; padding:12px; color:#a8a29e; border:1px solid #fdba74;">No items</td></tr>`;
            } else {
              cat.items.forEach((item, idx) => {
                const rowBg = idx % 2 === 0 ? '#fff' : '#fff7ed';
                htmlContent += `
                  <tr style="background-color:${rowBg};">
                    <td style="padding:8px 12px; border:1px solid #fdba74; color:#57534e;">${idx + 1}</td>
                    <td style="padding:8px 12px; border:1px solid #fdba74; font-weight:bold; color:#1c1917;">${item.name || ''}</td>
                    <td style="padding:8px 12px; border:1px solid #fdba74; color:#44403c;">${item.quantity || ''}</td>
                    <td style="padding:8px 12px; border:1px solid #fdba74; color:#44403c;">${item.oldStock || ''}</td>
                    <td style="padding:8px 12px; border:1px solid #fdba74; color:#44403c;">${item.purchaseQuantity || ''}</td>
                  </tr>
                `;
              });
            }
            htmlContent += `</tbody></table>`;
          });
          
          pdfContainer.innerHTML = htmlContent;
          
          const opt = {
            margin:       10,
            filename:     'LDSS_Mahoor_List.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };
          
          html2pdf().set(opt).from(pdfContainer).save().then(() => {
            showToast("PDF Downloaded successfully!");
          }).catch(err => {
            showToast("Error generating PDF.");
            console.error(err);
          });
        }, 400); 
      };

      const shareViaWhatsApp = async () => {
        const csv = generateCSVContent();
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const file = new File([blob], 'LDSS_Mahoor_List.csv', { type: 'text/csv' });
        
        setIsSidebarOpen(false);

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              title: 'LDSS - Mahoor List',
              text: 'Here is the generated Mahoor List Excel file.',
              files: [file]
            });
            showToast("Opening share menu...");
          } catch (err) {
            if (err.name !== 'AbortError') {
               showToast("Sharing failed or not supported for files.");
            }
          }
        } else {
           showToast("Downloading file... Please attach it in WhatsApp manually.");
           setTimeout(() => {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'LDSS_Mahoor_List.csv';
              a.click();
              URL.revokeObjectURL(url);
           }, 1500);
        }
      };

      const handleCreateTable = () => {
        if (!newTableTitle.trim()) return;
        
        const newId = `cat-${Date.now()}`;
        const nextNum = data.length + 1;
        const formattedTitle = `${nextNum}. ${newTableTitle}`;
        
        updateData(prev => [...prev, {
          id: newId,
          title: formattedTitle,
          items: []
        }]);
        
        setNewTableTitle('');
        setIsAddTableModalOpen(false);
        setIsSidebarOpen(false);
        showToast(`New table "${formattedTitle}" added!`);
        
        setTimeout(() => {
          scrollToCategory(newId);
        }, 100);
      };

      const handleDeleteTable = () => {
        updateData(prev => prev.filter(cat => cat.id !== tableToDelete));
        
        if (activeCategory === tableToDelete && data.length > 1) {
           const newActive = data.find(c => c.id !== tableToDelete);
           if(newActive) setActiveCategory(newActive.id);
        }
        
        setTableToDelete('');
        setShowDeleteWarning(false);
        setIsDeleteTableModalOpen(false);
        setIsSidebarOpen(false);
        showToast("Table deleted permanently.");
      };

      const checkIsListening = (categoryId, itemId, field) => {
        return listeningState && 
               listeningState.categoryId === categoryId && 
               listeningState.itemId === itemId && 
               listeningState.field === field;
      };

      const activeColumnFilters = Object.entries(columnFilters).filter(([, v]) => Array.isArray(v));
      const trimmedSearch = searchQuery.trim().toLowerCase();
      const displayedData = (trimmedSearch === '' && activeColumnFilters.length === 0)
        ? data
        : data.map(category => ({
            ...category,
            items: category.items.filter(item => {
              const matchesSearch = trimmedSearch === '' || colOrder.some(colKey => {
                if (colKey === 'sno' || colKey === 'actions') return false;
                const field = colFieldMap[colKey] || colKey;
                return (item[field] || '').toString().toLowerCase().includes(trimmedSearch);
              });
              const matchesFilters = activeColumnFilters.every(([colKey, selectedValues]) => {
                const field = colFieldMap[colKey] || colKey;
                const raw = (item[field] || '').toString().trim();
                const normalized = raw === '' ? BLANK_TOKEN : raw;
                return selectedValues.includes(normalized);
              });
              return matchesSearch && matchesFilters;
            })
          })).filter(category => category.items.length > 0);

      return (
        <div className="min-h-screen bg-[#FCF9F2] text-stone-800 font-sans pb-16">
          
          {/* Sidebar Overlay */}
          <div className={`fixed inset-0 z-[60] flex transition-opacity duration-300 no-print ${isSidebarOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>
            
            <div className={`relative w-24 sm:w-28 bg-gradient-to-b from-orange-600 to-orange-700 border-r border-orange-500/50 h-full shadow-2xl flex flex-col items-center py-6 gap-6 transform transition-transform duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] overflow-y-auto scrollbar-hide ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
              
              <div className="relative cursor-pointer hover:scale-105 transition-transform">
                <img src="https://cdn.wallpapersafari.com/15/40/zlOjX4.jpg" alt="Profile" className="w-10 h-10 rounded-full object-cover border border-orange-300/40" />
                <div className="absolute bottom-0 right-0 w-3 h-3 bg-[#a2ff00] border-2 border-orange-600 rounded-full"></div>
              </div>

              <div className="flex flex-col gap-6 items-center w-full mt-2 pb-6">
                
                <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => setIsSidebarOpen(false)}>
                  <button className="text-orange-100 group-hover:text-white p-2.5 rounded-xl group-hover:bg-white/20 transition-all">
                    <Icons.ArrowRight className="w-6 h-6" />
                  </button>
                  <span className="text-[10px] text-orange-200 group-hover:text-white font-semibold tracking-wide">Back</span>
                </div>
                
                <div className="w-12 h-px bg-orange-300/30 my-1"></div>

                <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={handleOpenFileClick}>
                  <button className="text-orange-100 group-hover:text-white p-2.5 rounded-xl group-hover:bg-white/20 transition-all">
                    <Icons.FolderOpen className="w-6 h-6" />
                  </button>
                  <span className="text-[10px] text-orange-200 group-hover:text-white font-semibold tracking-wide whitespace-nowrap">Open File</span>
                </div>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".xlsx,.xls,.csv"
                  onChange={handleFileSelected}
                  className="hidden"
                />

                <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => setIsAddTableModalOpen(true)}>
                  <button className="text-orange-100 group-hover:text-white p-2.5 rounded-xl group-hover:bg-white/20 transition-all">
                    <Icons.TablePlus className="w-6 h-6" />
                  </button>
                  <span className="text-[10px] text-orange-200 group-hover:text-white font-semibold tracking-wide whitespace-nowrap">Add Table</span>
                </div>

                <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={() => setIsDeleteTableModalOpen(true)}>
                  <button className="text-orange-100 group-hover:text-white p-2.5 rounded-xl group-hover:bg-red-500/80 transition-all">
                    <Icons.TableMinus className="w-6 h-6" />
                  </button>
                  <span className="text-[10px] text-orange-200 group-hover:text-white font-semibold tracking-wide whitespace-nowrap">Delete Table</span>
                </div>

                <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={downloadCSV}>
                  <button className="text-orange-100 group-hover:text-white p-2.5 rounded-xl group-hover:bg-white/20 transition-all">
                    <Icons.FileExcel className="w-6 h-6" />
                  </button>
                  <span className="text-[10px] text-orange-200 group-hover:text-white font-semibold tracking-wide whitespace-nowrap">Export Excel</span>
                </div>

                <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={downloadPDF}>
                  <button className="bg-white/20 text-white p-2.5 rounded-xl group-hover:bg-white/30 transition-all shadow-lg border border-white/20 relative">
                    <Icons.FilePdf className="w-6 h-6" />
                  </button>
                  <span className="text-[10px] text-white font-bold tracking-wide whitespace-nowrap drop-shadow-md">Print PDF</span>
                </div>

                <div className="flex flex-col items-center gap-1.5 cursor-pointer group" onClick={shareViaWhatsApp}>
                  <button className="bg-white/20 text-[#4ade80] p-2.5 rounded-xl group-hover:bg-[#25D366] group-hover:text-white transition-all shadow-lg border border-white/20 relative">
                    <Icons.WhatsApp className="w-6 h-6" />
                  </button>
                  <span className="text-[10px] text-white font-bold tracking-wide whitespace-nowrap drop-shadow-md">Share WA</span>
                </div>
              </div>
            </div>
          </div>

          {/* Add Table Modal */}
          {isAddTableModalOpen && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4 transition-opacity no-print">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-stone-100">
                <div className="p-6">
                  <h3 className="text-xl font-bold text-stone-800 mb-2 flex items-center gap-2">
                    <Icons.TablePlus className="w-5 h-5 text-orange-500" /> New Table Category
                  </h3>
                  <p className="text-stone-500 text-sm mb-4">Enter a heading for the new inventory table.</p>
                  <input 
                    type="text" 
                    autoFocus
                    placeholder="e.g. Kitchen Setup, Decorations..." 
                    value={newTableTitle}
                    onChange={(e) => setNewTableTitle(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleCreateTable()}
                    className="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-stone-800 font-medium focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
                  />
                </div>
                <div className="flex bg-[#FCF9F2] p-4 gap-3 justify-end border-t border-stone-100">
                  <button onClick={() => setIsAddTableModalOpen(false)} className="px-5 py-2 text-sm font-semibold text-stone-600 bg-white border border-stone-200 rounded-xl hover:bg-stone-50 shadow-sm transition-colors">Cancel</button>
                  <button onClick={handleCreateTable} className="px-5 py-2 text-sm font-semibold text-white bg-gradient-to-r from-orange-500 to-amber-500 rounded-xl hover:from-orange-600 hover:to-amber-600 shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled={!newTableTitle.trim()}>Create Table</button>
                </div>
              </div>
            </div>
          )}

          {/* Delete Table Modal */}
          {isDeleteTableModalOpen && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4 transition-opacity no-print">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-stone-100">
                
                {!showDeleteWarning ? (
                  <>
                    <div className="p-6">
                      <h3 className="text-xl font-bold text-stone-800 mb-2 flex items-center gap-2">
                        <Icons.TableMinus className="w-5 h-5 text-red-500" /> Delete Table
                      </h3>
                      <p className="text-stone-500 text-sm mb-4">Select a table you wish to remove.</p>
                      
                      <div className="max-h-60 overflow-y-auto space-y-2 pr-2 scrollbar-hide">
                        {data.map(cat => (
                          <div 
                            key={cat.id} 
                            onClick={() => setTableToDelete(cat.id)}
                            className={`p-3 rounded-xl border cursor-pointer transition-all ${tableToDelete === cat.id ? 'border-red-500 bg-red-50 shadow-sm' : 'border-stone-200 hover:border-red-200 hover:bg-stone-50'}`}
                          >
                            <span className={`text-sm font-bold ${tableToDelete === cat.id ? 'text-red-700' : 'text-stone-700'}`}>{cat.title}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="flex bg-[#FCF9F2] p-4 gap-3 justify-end border-t border-stone-100">
                      <button onClick={() => { setIsDeleteTableModalOpen(false); setTableToDelete(''); }} className="px-5 py-2 text-sm font-semibold text-stone-600 bg-white border border-stone-200 rounded-xl hover:bg-stone-50 shadow-sm transition-colors">Cancel</button>
                      <button 
                        onClick={() => setShowDeleteWarning(true)} 
                        className="px-5 py-2 text-sm font-semibold text-white bg-red-500 rounded-xl hover:bg-red-600 shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed" 
                        disabled={!tableToDelete}
                      >
                        Next
                      </button>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="p-6 text-center">
                      <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                        <Icons.Trash className="w-8 h-8" />
                      </div>
                      <h3 className="text-xl font-bold text-stone-800 mb-2">Are you absolutely sure?</h3>
                      <p className="text-stone-500 text-sm mb-4">
                        This table will be permanently deleted along with all its data. This action cannot be undone.
                      </p>
                    </div>
                    <div className="flex bg-red-50 p-4 gap-3 justify-end border-t border-red-100">
                      <button onClick={() => setShowDeleteWarning(false)} className="px-5 py-2 text-sm font-semibold text-stone-600 bg-white border border-stone-200 rounded-xl hover:bg-stone-50 shadow-sm transition-colors">Back</button>
                      <button 
                        onClick={handleDeleteTable} 
                        className="px-5 py-2 text-sm font-semibold text-white bg-red-600 rounded-xl hover:bg-red-700 shadow-sm transition-all"
                      >
                        Proceed
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[90] bg-stone-800 text-white px-4 py-3 rounded-xl shadow-2xl text-sm transition-all text-center w-11/12 max-w-sm font-medium">
              {toastMessage}
            </div>
          )}

          <div id="sticky-top-bar" className="sticky top-0 z-40 shadow-sm border-b border-orange-100/50 no-print">
            <header className="bg-gradient-to-r from-orange-600 to-amber-500 text-white shadow-md relative z-20">
              <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <div className="w-16 flex items-center">
                  <img 
                    src="https://cdn.wallpapersafari.com/15/40/zlOjX4.jpg" 
                    alt="Lord Dattatreya" 
                    onClick={() => setIsSidebarOpen(true)}
                    className="h-11 w-11 rounded-full object-cover border-2 border-white/40 shadow-sm cursor-pointer hover:scale-105 hover:border-white transition-all active:scale-95" 
                    title="Open Menu"
                  />
                </div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-extrabold tracking-wide drop-shadow-sm">LDSS - Mahoor List</h1>
                </div>
                <div className="w-16 flex items-center justify-end">
                  <button
                    onClick={handleSaveExcel}
                    title="Save as Excel"
                    className="relative w-11 h-11 flex items-center justify-center rounded-full bg-white/15 hover:bg-white/25 active:scale-90 transition-all animate-pulse"
                  >
                    {isSaving && <span className="absolute inset-0 rounded-full bg-white animate-ping"></span>}
                    <Icons.Save className="w-5 h-5 text-white relative z-10" />
                  </button>
                </div>
              </div>
            </header>

            <div className="px-4 py-3 bg-[#FCF9F2]/85 backdrop-blur-xl relative z-10 border-b border-stone-200/40">
              <div className="relative flex items-center w-full h-[46px] rounded-2xl bg-white/70 shadow-[0_4px_16px_-4px_rgba(0,0,0,0.05)] border border-white focus-within:bg-white focus-within:shadow-[0_4px_20px_-4px_rgba(249,115,22,0.2)] focus-within:border-orange-200 transition-all duration-300">
                <div className="pl-4 pr-2 text-stone-400">
                  <Icons.Search />
                </div>
                <input
                  type="text"
                  placeholder="Search items, quantities..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="flex-1 bg-transparent border-none focus:ring-0 text-sm font-semibold text-stone-800 placeholder-stone-400 h-full w-full outline-none"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="p-2 text-stone-400 hover:text-stone-600 transition-colors">
                    <Icons.Close />
                  </button>
                )}
                <div className="h-6 w-px bg-stone-200 mx-1"></div>
                <button
                  onClick={(e) => { e.stopPropagation(); toggleVoiceInput('search', 'global', 'query'); }}
                  className={`pr-4 pl-2 h-full flex items-center justify-center transition-colors ${checkIsListening('search', 'global', 'query') ? 'text-red-500' : 'text-stone-400 hover:text-orange-500'}`}
                >
                  {checkIsListening('search', 'global', 'query') ? <Icons.MicActive className="w-5 h-5" /> : <Icons.Mic className="w-5 h-5" />}
                </button>
              </div>
            </div>

            <div className="max-w-4xl mx-auto px-2 py-2 bg-[#FCF9F2]/90 backdrop-blur-md relative z-10 shadow-sm border-b border-stone-200/50">
              <div className="flex items-center justify-between px-2 mb-1.5">
                <h2 className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">Category</h2>
                <div className="flex items-center gap-1 bg-white rounded-full px-1 py-0.5 border border-stone-200 shadow-sm">
                  <button onClick={handleUndo} disabled={past.length === 0} className={`p-1 rounded-full ${past.length === 0 ? 'text-stone-300' : 'text-stone-500 hover:text-orange-500'}`}><Icons.Undo /></button>
                  <div className="w-px h-3 bg-stone-200"></div>
                  <button onClick={handleRedo} disabled={future.length === 0} className={`p-1 rounded-full ${future.length === 0 ? 'text-stone-300' : 'text-stone-500 hover:text-orange-500'}`}><Icons.Redo /></button>
                </div>
              </div>
              <div className="flex gap-2 sm:gap-4 overflow-x-auto pb-1 scrollbar-hide snap-x px-1">
                {categoryNavItems.map(cat => (
                  <div 
                    key={cat.id} 
                    id={`nav-${cat.id}`}
                    onClick={() => scrollToCategory(cat.id)} 
                    className="flex flex-col items-center gap-1 cursor-pointer snap-start min-w-[56px]"
                  >
                    <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-all duration-300 active:scale-95 ${activeCategory === cat.id ? 'bg-gradient-to-br from-orange-500 to-amber-500 text-white shadow-md border-0' : 'bg-white text-orange-400 border border-stone-200 shadow-sm'}`}>
                      <cat.icon className="w-5 h-5" />
                    </div>
                    <span className={`text-[9px] font-bold tracking-wide transition-colors ${activeCategory === cat.id ? 'text-orange-600' : 'text-stone-400'}`}>
                      {cat.name}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Global Sub-Heading (Sticky Columns) */}
            <div className={`overflow-hidden bg-[#FCF9F2]/95 backdrop-blur-sm ${showGlobalHeader ? 'block' : 'hidden'} border-t border-orange-200/60 shadow-md`}>
              <div className="max-w-4xl mx-auto px-3 sm:px-4 py-1">
                <div className="border-x border-orange-100/60 rounded-t-sm">
                  <div ref={globalHeaderScrollRef} className="overflow-x-hidden bg-white">
                    <div className="flex bg-orange-50 text-orange-800 text-[11px] font-bold py-2 tracking-wider w-max border-b border-orange-100/60">
                      {colOrder.map(colKey => renderHeaderCell(colKey))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <main className="max-w-4xl mx-auto p-3 sm:p-4 mt-2 space-y-8">
            {displayedData.length === 0 ? (
              <div className="text-center py-20 flex flex-col items-center justify-center">
                <div className="w-20 h-20 bg-orange-100/50 rounded-full flex items-center justify-center mb-4 text-orange-400">
                  <Icons.Search className="w-10 h-10" />
                </div>
                <h3 className="text-lg font-bold text-stone-700">No items found</h3>
                <p className="text-sm text-stone-500 mt-1">Try adjusting your search query.</p>
              </div>
            ) : (
              displayedData.map((category) => (
                <div key={category.id} id={category.id} className="bg-white rounded-2xl shadow-sm border border-orange-100/60 overflow-hidden">
                  
                  <div className="bg-gradient-to-r from-orange-500 to-amber-500 text-white px-4 py-3 relative flex items-center justify-center">
                    <h2 className="text-lg font-extrabold text-center drop-shadow-sm">{category.title}</h2>
                    <button
                      onClick={(e) => { e.stopPropagation(); setTableMenuOpen(prev => prev === category.id ? null : category.id); }}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-white/90 hover:text-white p-1.5 rounded-full hover:bg-white/15 transition-colors cursor-pointer no-print"
                      title="Table options"
                    >
                      <Icons.MoreVertical className="w-5 h-5" />
                    </button>
                    {tableMenuOpen === category.id && renderTableMenu(category.id)}
                  </div>

                  <div 
                    id={`scroll-container-${category.id}`} 
                    className="overflow-x-auto scrollbar-hide"
                    onScroll={(e) => {
                      if (globalHeaderScrollRef.current) {
                        globalHeaderScrollRef.current.scrollLeft = e.currentTarget.scrollLeft;
                      }
                    }}
                  >
                    <div className="w-max">
                      <div id={`native-header-${category.id}`} className="flex bg-orange-50 text-orange-800 text-[11px] font-bold py-2 border-b border-orange-100/60 tracking-wider">
                        {colOrder.map(colKey => renderHeaderCell(colKey))}
                      </div>

                      <div className="divide-y divide-stone-100/80">
                        {category.items.length === 0 ? (
                          <div className="p-6 text-center text-stone-400 text-sm font-medium bg-[#FCF9F2]">No items in this category.</div>
                        ) : (
                          category.items.map((item, index) => (
                            <div
                              key={item.id}
                              onClick={() => setSelectedRow(item.id)}
                              onDragOver={(e) => handleRowDragOver(e, category.id)}
                              onDrop={(e) => handleRowDrop(e, category.id, item.id)}
                              className={`flex items-start py-2 transition-all duration-300 cursor-pointer ${selectedRow === item.id ? 'bg-gradient-to-r from-orange-200/90 via-orange-100/80 to-orange-50/50 relative z-10 shadow-[inset_6px_0_0_0_#ea580c,0_4px_12px_-2px_rgba(234,88,12,0.15)] border-y border-orange-300/80' : 'bg-[#FCF9F2] hover:bg-orange-50/50'}`}
                            >
                              {swapModeCategories[category.id] && (
                                <div
                                  draggable="true"
                                  onDragStart={(e) => { e.stopPropagation(); handleRowDragStart(e, category.id, item.id); }}
                                  onDragEnd={(e) => { e.stopPropagation(); handleRowDragEnd(); }}
                                  onMouseDown={(e) => { e.stopPropagation(); setHeldHandleItemId(item.id); }}
                                  onMouseUp={(e) => { e.stopPropagation(); setHeldHandleItemId(null); }}
                                  onTouchStart={(e) => { e.stopPropagation(); setHeldHandleItemId(item.id); }}
                                  onTouchEnd={(e) => { e.stopPropagation(); setHeldHandleItemId(null); }}
                                  title="Hold and drag to move up/down"
                                  className={`no-print shrink-0 w-6 self-stretch flex items-center justify-center cursor-grab active:cursor-grabbing rounded transition-colors ${heldHandleItemId === item.id ? 'bg-green-200' : ''}`}
                                >
                                  <Icons.GripVertical className="w-4 h-4 text-stone-400" />
                                </div>
                              )}
                              {colOrder.map(colKey => renderRowCell(colKey, category, item, index))}
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="bg-[#FCF9F2] p-3 flex justify-center no-print border-t border-orange-100/40">
                    <button onClick={() => addRow(category.id)} className="flex items-center gap-1 text-sm font-semibold text-orange-600 bg-orange-100/50 hover:bg-orange-100 px-4 py-2 rounded-full transition-colors w-full justify-center sm:w-auto shadow-sm">
                      <Icons.Plus className="w-4 h-4" /> Add New Detail
                    </button>
                  </div>
                  
                </div>
              ))
            )}
          </main>
          
          {/* Delete Row Confirmation Modal */}
          {itemToDelete && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4 transition-opacity no-print">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden border border-stone-100 text-center p-6">
                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                  <Icons.Trash className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-stone-800 mb-2">Delete Row?</h3>
                <p className="text-stone-500 text-sm mb-6">Are you sure you want to remove this item?</p>
                <div className="flex gap-3 justify-center">
                  <button onClick={() => setItemToDelete(null)} className="px-5 py-2 text-sm font-semibold text-stone-600 bg-stone-50 border border-stone-200 rounded-xl hover:bg-stone-100 transition-colors">Cancel</button>
                  <button onClick={confirmDeleteRow} className="px-5 py-2 text-sm font-semibold text-white bg-red-500 rounded-xl hover:bg-red-600 shadow-sm transition-all">Delete</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
